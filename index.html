<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola 💗</title>
  <style>
    body {
      background: #f9aae3;
      color: #5a1d4a;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
      box-sizing: border-box; text-align: center;
      transition: background 2s, color 2s;
    }
    body.oscuro { background: #000; color: #fff; }

    input {
      font-size: 1.2rem; padding: 12px 18px; border: none;
      border-radius: 999px; outline: none; text-align: center;
      margin: 10px 0; width: 240px; max-width: 80%;
    }
    button {
      font-size: 1.1rem; padding: 12px 28px; border: none;
      border-radius: 999px; background: #fff; color: #c2188f;
      cursor: pointer; margin: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.15);
      transition: transform .15s;
    }
    button:hover { transform: scale(1.06); }

    #mensaje { margin-top: 20px; position: relative; z-index: 2; }

    /* Mensajes con fade-in */
    .msg { opacity: 0; animation: aparecer 1s forwards; font-size: 1.6rem; margin: 14px 0; }
    @keyframes aparecer { to { opacity: 1; } }

    /* Corazones */
    .corazon { position: fixed; bottom: -40px; animation: subir linear forwards; pointer-events: none; z-index: 1; }
    @keyframes subir { to { transform: translateY(-110vh); opacity: 0; } }

    /* Lluvia */
    .gota {
      position: fixed; top: -30px; width: 2px; height: 20px;
      background: rgba(255,255,255,.5); pointer-events: none;
      animation: caer linear forwards; z-index: 1;
    }
    @keyframes caer { to { transform: translateY(110vh); } }

    .porque { font-size: 2.5rem; opacity: 0; animation: aparecer 2s forwards; }

    .meme {
      max-width: 280px; width: 80%; border-radius: 12px; margin: 10px;
      opacity: 0; animation: aparecer 1s forwards;
    }
  </style>
</head>
<body>
  <h1 id="titulo">¿Cómo te llamas?</h1>
  <input id="nombre" placeholder="Tu nombre" autocomplete="off">
  <button id="btn">Entrar</button>
  <button id="siguiente" style="display:none">Siguiente 💗</button>
  <div id="mensaje"></div>

  <script>
    const mensajes = [
      "Hola, Valentina 💗",
      "Te quiero muchísimo",
      "Eres la mejor diseñadora del mundo",
      "Y una de mis personas favoritas",
      "Gracias por ser como eres",
      "Esto lo hice solo para ti",
      "Por siempre nacho 💗"
    ];

    const memesJuliana = [
      "memes/soldado.jpg",
      "memes/terror.png",
      "memes/gato-oscuro.png",
      "memes/nino-cruz.png",
      "memes/gato-asustado.png"
    ];

    const normalizar = (t) =>
      t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    let indice = 0;

    function ocultarEntrada() {
      document.getElementById("btn").style.display = "none";
      document.getElementById("nombre").style.display = "none";
    }

    function mostrarSiguiente() {
      const salida = document.getElementById("mensaje");
      if (indice >= mensajes.length) return;
      const p = document.createElement("p");
      p.textContent = mensajes[indice];
      p.className = "msg";
      salida.appendChild(p);
      indice++;
      if (indice === mensajes.length) {
        document.getElementById("siguiente").style.display = "none";
      }
    }

    function lluviaDeCorazones() {
      setInterval(() => {
        const c = document.createElement("span");
        c.className = "corazon";
        c.textContent = "💗";
        c.style.left = Math.random() * 100 + "vw";
        c.style.fontSize = 16 + Math.random() * 24 + "px";
        c.style.animationDuration = 4 + Math.random() * 4 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 8000);
      }, 400);
    }

    function mostrarMemes() {
      const salida = document.getElementById("mensaje");
      memesJuliana.forEach((src, i) => {
        const img = document.createElement("img");
        img.src = src;
        img.className = "meme";
        img.style.animationDelay = i * 1.2 + "s";
        salida.appendChild(img);
      });
    }

    function lluvia() {
      setInterval(() => {
        const g = document.createElement("div");
        g.className = "gota";
        g.style.left = Math.random() * 100 + "vw";
        g.style.animationDuration = 0.5 + Math.random() * 0.5 + "s";
        document.body.appendChild(g);
        setTimeout(() => g.remove(), 1200);
      }, 40);
    }

    function modoJuliana() {
      document.body.classList.add("oscuro");
      document.getElementById("titulo").style.display = "none";
      lluvia();
      const salida = document.getElementById("mensaje");
      setTimeout(() => {
        salida.innerHTML = '<h2 class="porque">¿por qué?</h2>';
      }, 2500);
      setTimeout(mostrarMemes, 5500);
    }

    function entrar() {
      const n = normalizar(document.getElementById("nombre").value);
      if (!n) return;

      if (n === "valentina") {
        ocultarEntrada();
        document.getElementById("titulo").style.display = "none";
        document.getElementById("siguiente").style.display = "inline-block";
        lluviaDeCorazones();
        mostrarSiguiente();
      } else if (n === "juliana") {
        ocultarEntrada();
        modoJuliana();
      } else {
        const salida = document.getElementById("mensaje");
        salida.innerHTML = '<p class="msg">Hola 😊 Esta página no es para ti... ¡pero que tengas un lindo día!</p>';
      }
    }

    document.getElementById("btn").addEventListener("click", entrar);
    document.getElementById("nombre").addEventListener("keydown", (e) => {
      if (e.key === "Enter") entrar();
    });
    document.getElementById("siguiente").addEventListener("click", mostrarSiguiente);
  </script>
</body>
</html>
